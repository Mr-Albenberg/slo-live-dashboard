<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>SLO // Live Operations</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <style>
    :root{--ink:#03080d;--panel:#071321eb;--line:#26526a;--text:#eaf6fb;--muted:#9db8c7;--cyan:#61dcff;--orange:#ff864e;--green:#53ebb0}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif}.map{position:relative;width:100%;height:100%;overflow:hidden;background:#06111c}.map iframe{display:block;width:calc(100% + 96px);height:100%;border:0;background:#06111c}
    header{position:fixed;z-index:5;top:14px;left:14px;right:14px;height:68px;display:grid;grid-template-columns:minmax(255px,1fr) minmax(480px,680px);align-items:center;gap:18px;padding:9px 14px 9px 17px;background:#071522ed;border:1px solid #255069;border-radius:12px;box-shadow:0 14px 36px #0009;backdrop-filter:blur(11px)}.topline{display:flex;align-items:center;gap:11px}.beacon{width:11px;height:11px;flex:0 0 auto;border-radius:50%;background:#6d8290}.beacon.live{background:var(--green);box-shadow:0 0 16px #53ebb0cc}.eyebrow{color:var(--cyan);font-size:10px;font-weight:850;letter-spacing:.18em}.topline h1{margin:2px 0 0;font-size:18px;letter-spacing:.025em;line-height:1.05}.status{margin-left:auto;padding-left:14px;border-left:1px solid #284e63;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.08em;text-align:right}.controls{display:grid;grid-template-columns:auto minmax(180px,1fr) auto;align-items:center;gap:9px;padding:5px;border-radius:9px;background:#0d1c29;border:1px solid #213f51}.controls::before{display:none}button{height:38px;padding:0 14px;border:0;border-radius:6px;background:#ff8050;color:#fff;font:850 10px Inter,system-ui,sans-serif;letter-spacing:.06em;cursor:pointer;box-shadow:none}button:hover{filter:brightness(1.1)}button:disabled{opacity:.55;cursor:wait}.secondary{background:#102c3e;border:1px solid #35647c;color:#dff5fc}audio{width:100%;height:34px;filter:none}.hud{position:absolute;z-index:2;pointer-events:none}.scan{display:none}.badge{top:96px;left:14px;max-width:260px;padding:10px 12px;border-left:2px solid var(--cyan);border-radius:2px;background:#071522e8;box-shadow:0 8px 22px #0008;backdrop-filter:blur(8px)}.badge b{display:block;color:var(--cyan);font-size:10px;letter-spacing:.13em}.badge b::before{content:'';margin:0}.badge span{display:block;margin-top:4px;color:#bed0da;font-size:11px;line-height:1.35}.hint{bottom:14px;left:14px;padding:5px 8px;border-left:2px solid var(--cyan);background:#06131ad9;color:#bdd4df;font-size:9px;font-weight:700;letter-spacing:.06em;text-shadow:0 2px 5px #000}
    dialog{width:min(720px,calc(100% - 28px));border:1px solid var(--line);border-radius:14px;padding:0;background:#091522;color:var(--text);box-shadow:0 24px 100px #000}dialog::backdrop{background:#000b}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);color:var(--cyan);font-size:11px;font-weight:850;letter-spacing:.13em}.modal-head button{height:auto;padding:0;background:none;color:var(--text);font-size:22px}.modal-body{padding:15px}.modal-body p{margin:0 0 12px;color:var(--muted);font-size:12px}.modal-body iframe{width:100%;height:290px;border:0;background:#06111c}
    @media(max-width:840px){header{top:8px;left:8px;right:8px;height:auto;grid-template-columns:1fr;gap:7px;padding:10px 11px}.topline h1{font-size:16px}.controls{grid-template-columns:auto minmax(105px,1fr) auto;gap:6px;padding:4px}.status{font-size:9px}.badge{top:144px;left:8px;max-width:210px;padding:9px 10px}.hint{display:none}.map iframe{width:calc(100% + 76px)}button{height:36px;padding:0 9px;font-size:9px}audio{height:32px}}
  </style>
</head>
<body>
  <header>
    <div class="topline"><span id="beacon" class="beacon"></span><div><div class="eyebrow">SLO // LIVE OPERATIONS</div><h1>PUBLIC SAFETY AUDIO</h1></div><span id="status" class="status">READY</span></div>
    <div class="controls"><button id="start" type="button">START AUDIO</button><audio id="audio" controls playsinline></audio><button id="fallback" class="secondary" type="button">FALLBACK PLAYER</button></div>
  </header>
  <main class="map">
    <iframe id="flightMap" title="Live aircraft near San Luis Obispo" src="https://globe.adsbexchange.com/?lat=35.2828&amp;lon=-120.6596&amp;zoom=9.5&amp;embedded_webview=true" allow="geolocation;fullscreen" loading="eager"></iframe>
    <div class="hud scan"></div><div class="hud badge"><b>LIVE AIR TRAFFIC // KSBP</b><span>Click an aircraft for live details.</span></div><div class="hud hint">LIVE AIRCRAFT TRACKING</div>
  </main>
  <dialog id="fallbackDialog"><div class="modal-head">BROADCASTIFY FALLBACK PLAYER<button id="closeDialog" type="button" aria-label="Close">×</button></div><div class="modal-body"><p>Use this player when the direct stream is blocked by the browser.</p><iframe title="SLO County Public Safety audio player" src="https://www.broadcastify.com/listen/feed/popout.php?feedId=44069" allow="autoplay"></iframe></div></dialog>
  <script>
    const STREAM='https://hls-o2.broadcastify.com/t/v1./feed/44069/playlist.m3u8';
    const audio=document.getElementById('audio'),start=document.getElementById('start'),status=document.getElementById('status'),beacon=document.getElementById('beacon'),fallbackDialog=document.getElementById('fallbackDialog');let hls;
    function state(text,live=false){status.textContent=text;beacon.classList.toggle('live',live)}
    async function play(){start.disabled=true;state('CONNECTING');try{if(hls){hls.destroy();hls=undefined}audio.pause();audio.removeAttribute('src');audio.load();if(audio.canPlayType('application/vnd.apple.mpegurl'))audio.src=STREAM;else if(window.Hls&&Hls.isSupported()){hls=new Hls({liveSyncDurationCount:3,enableWorker:true});hls.loadSource(STREAM);hls.attachMedia(audio);hls.on(Hls.Events.ERROR,(_event,data)=>{if(data.fatal){state('USE FALLBACK PLAYER');start.textContent='TRY AGAIN'}})}else throw new Error('HLS unsupported');await audio.play();state('LIVE',true);start.textContent='RECONNECT'}catch(error){console.warn(error);state('USE FALLBACK PLAYER');start.textContent='TRY AGAIN'}finally{start.disabled=false}}
    start.addEventListener('click',play);audio.addEventListener('playing',()=>state('LIVE',true));audio.addEventListener('waiting',()=>state('BUFFERING'));audio.addEventListener('pause',()=>{if(audio.currentTime)state('PAUSED')});document.getElementById('fallback').addEventListener('click',()=>fallbackDialog.showModal());document.getElementById('closeDialog').addEventListener('click',()=>fallbackDialog.close());
  </script>
</body>
</html>
