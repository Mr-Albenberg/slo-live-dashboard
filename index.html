<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>SLO // Live Operations</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <style>
    :root{--ink:#03080d;--panel:#071321eb;--line:#26526a;--text:#eaf6fb;--muted:#9db8c7;--cyan:#61dcff;--orange:#ff864e;--green:#53ebb0}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif}.map{position:relative;width:100%;height:100%;background:#06111c}.map iframe{display:block;width:100%;height:100%;border:0;background:#06111c}
    header{position:fixed;z-index:5;top:16px;left:16px;right:16px;min-height:94px;display:grid;grid-template-columns:minmax(220px,1fr) minmax(330px,540px);align-items:center;gap:20px;padding:15px 20px;background:linear-gradient(104deg,#071725f4,#08121df2 55%,#071725f4);border:1px solid var(--line);border-radius:17px;box-shadow:0 18px 55px #000b;backdrop-filter:blur(14px)}.topline{display:flex;align-items:center;gap:13px}.beacon{width:13px;height:13px;flex:0 0 auto;border-radius:50%;background:#6d8290;box-shadow:0 0 15px #6d829044}.beacon.live{background:var(--green);box-shadow:0 0 18px #53ebb0cc}.eyebrow{color:var(--cyan);font-size:11px;font-weight:850;letter-spacing:.19em}.topline h1{margin:2px 0 0;font-size:21px;letter-spacing:.035em;line-height:1.05}.status{margin-left:auto;padding-left:14px;border-left:1px solid #2d556a;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.08em;text-align:right}.controls{display:grid;grid-template-columns:auto minmax(160px,1fr) auto;align-items:center;gap:10px}button{height:50px;padding:0 17px;border:0;border-radius:11px;background:linear-gradient(135deg,#ff704a,#ff9a4d);color:#fff;font:850 12px Inter,system-ui,sans-serif;letter-spacing:.055em;cursor:pointer;box-shadow:0 8px 22px #ff704a2c}button:hover{filter:brightness(1.12)}button:disabled{opacity:.55;cursor:wait}.secondary{background:#0a2638;border:1px solid #386780;color:#d8f1fb;box-shadow:none}audio{width:100%;height:46px;filter:drop-shadow(0 5px 13px #0008)}.hud{position:absolute;z-index:2;pointer-events:none}.scan{inset:0;opacity:.09;background:repeating-linear-gradient(0deg,transparent 0 3px,#a7f5ff0a 3px 4px)}.badge{top:128px;left:16px;max-width:290px;padding:16px;border:1px solid #2b5c74;border-radius:14px;background:#071725e9;box-shadow:0 16px 38px #0009;backdrop-filter:blur(10px)}.badge b{display:block;color:var(--cyan);font-size:11px;letter-spacing:.14em}.badge b::before{content:'◢';margin-right:8px;color:#61dcff}.badge span{display:block;margin-top:7px;color:#c2d8e5;font-size:12px;line-height:1.42}.hint{bottom:16px;left:18px;padding:7px 10px;border-left:2px solid var(--cyan);background:#06131abb;color:#bdd4df;font-size:10px;font-weight:700;letter-spacing:.07em;text-shadow:0 2px 5px #000}.locate{position:absolute;z-index:3;top:128px;right:16px;background:#071d2beF;border:1px solid #3c768f;color:#e3f8ff;box-shadow:0 12px 28px #0009}.you-pin{position:absolute;z-index:3;top:50%;left:50%;display:none;width:20px;height:20px;margin:-10px;border:3px solid #fff;border-radius:50%;background:#2c9fff;box-shadow:0 0 0 8px #2c9fff33,0 0 22px #2c9fffee;pointer-events:none}.you-pin::after{content:'YOU';position:absolute;top:23px;left:50%;transform:translateX(-50%);padding:3px 5px;border-radius:4px;background:#082033eF;color:#dff7ff;font-size:9px;font-weight:850;letter-spacing:.1em}.you-pin.active{display:block}
    dialog{width:min(720px,calc(100% - 28px));border:1px solid var(--line);border-radius:14px;padding:0;background:#091522;color:var(--text);box-shadow:0 24px 100px #000}dialog::backdrop{background:#000b}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);color:var(--cyan);font-size:11px;font-weight:850;letter-spacing:.13em}.modal-head button{height:auto;padding:0;background:none;color:var(--text);font-size:22px}.modal-body{padding:15px}.modal-body p{margin:0 0 12px;color:var(--muted);font-size:12px}.modal-body iframe{width:100%;height:290px;border:0;background:#06111c}
    @media(max-width:840px){header{top:8px;left:8px;right:8px;grid-template-columns:1fr;gap:10px;padding:12px 13px}.topline h1{font-size:17px}.controls{grid-template-columns:auto minmax(100px,1fr) auto}.status{font-size:9px}.badge{top:164px;left:8px;max-width:220px;padding:12px}.locate{top:164px;right:8px;height:42px;padding:0 11px}.hint{display:none}button{height:44px;padding:0 11px;font-size:10px}audio{height:42px}}
  </style>
</head>
<body>
  <header>
    <div class="topline"><span id="beacon" class="beacon"></span><div><div class="eyebrow">SLO // LIVE OPERATIONS</div><h1>PUBLIC SAFETY AUDIO</h1></div><span id="status" class="status">READY</span></div>
    <div class="controls"><button id="start" type="button">START AUDIO</button><audio id="audio" controls playsinline></audio><button id="fallback" class="secondary" type="button">FALLBACK PLAYER</button></div>
  </header>
  <main class="map">
    <iframe id="flightMap" title="Live aircraft near San Luis Obispo" src="https://globe.adsbexchange.com/?lat=35.2828&amp;lon=-120.6596&amp;zoom=9.5&amp;embedded_webview=true" allow="geolocation;fullscreen" loading="eager"></iframe>
    <div class="hud scan"></div><div class="hud badge"><b>LIVE AIR TRAFFIC // KSBP</b><span>Click an aircraft in the map for its available flight and aircraft details.</span></div><button id="locate" class="locate" type="button">◎ LOCATE ME</button><div id="youPin" class="you-pin" aria-hidden="true"></div><div class="hud hint">LIVE MAP PROVIDED BY THE EMBEDDED TRACKING SERVICE</div>
  </main>
  <dialog id="fallbackDialog"><div class="modal-head">BROADCASTIFY FALLBACK PLAYER<button id="closeDialog" type="button" aria-label="Close">×</button></div><div class="modal-body"><p>Use this player when the direct stream is blocked by the browser.</p><iframe title="SLO County Public Safety audio player" src="https://www.broadcastify.com/listen/feed/popout.php?feedId=44069" allow="autoplay"></iframe></div></dialog>
  <script>
    const STREAM='https://hls-o2.broadcastify.com/t/v1./feed/44069/playlist.m3u8';
    const audio=document.getElementById('audio'),start=document.getElementById('start'),status=document.getElementById('status'),beacon=document.getElementById('beacon'),fallbackDialog=document.getElementById('fallbackDialog'),flightMap=document.getElementById('flightMap'),locate=document.getElementById('locate'),youPin=document.getElementById('youPin');let hls;
    function state(text,live=false){status.textContent=text;beacon.classList.toggle('live',live)}
    async function play(){start.disabled=true;state('CONNECTING');try{if(hls){hls.destroy();hls=undefined}audio.pause();audio.removeAttribute('src');audio.load();if(audio.canPlayType('application/vnd.apple.mpegurl'))audio.src=STREAM;else if(window.Hls&&Hls.isSupported()){hls=new Hls({liveSyncDurationCount:3,enableWorker:true});hls.loadSource(STREAM);hls.attachMedia(audio);hls.on(Hls.Events.ERROR,(_event,data)=>{if(data.fatal){state('USE FALLBACK PLAYER');start.textContent='TRY AGAIN'}})}else throw new Error('HLS unsupported');await audio.play();state('LIVE',true);start.textContent='RECONNECT'}catch(error){console.warn(error);state('USE FALLBACK PLAYER');start.textContent='TRY AGAIN'}finally{start.disabled=false}}
    function mapUrl(lat,lon){return `https://globe.adsbexchange.com/?lat=${lat.toFixed(5)}&lon=${lon.toFixed(5)}&zoom=10&embedded_webview=true`}
    function locateMe(){if(!navigator.geolocation){locate.textContent='LOCATION UNAVAILABLE';return}locate.disabled=true;locate.textContent='LOCATING…';navigator.geolocation.getCurrentPosition(position=>{flightMap.src=mapUrl(position.coords.latitude,position.coords.longitude);youPin.classList.add('active');locate.textContent='◎ CENTERED ON YOU';locate.disabled=false},()=>{locate.textContent='LOCATION DENIED';locate.disabled=false},{enableHighAccuracy:true,timeout:10000,maximumAge:60000})}
    start.addEventListener('click',play);audio.addEventListener('playing',()=>state('LIVE',true));audio.addEventListener('waiting',()=>state('BUFFERING'));audio.addEventListener('pause',()=>{if(audio.currentTime)state('PAUSED')});document.getElementById('fallback').addEventListener('click',()=>fallbackDialog.showModal());document.getElementById('closeDialog').addEventListener('click',()=>fallbackDialog.close());locate.addEventListener('click',locateMe);
  </script>
</body>
</html>
